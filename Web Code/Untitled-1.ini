🚀 دليل رفع الموقع على GitHub Pages
الخطوة 1: إنشاء مستودع (Repository) على GitHub
سجّل الدخول إلى حسابك على GitHub.

اضغط على علامة + في الزاوية العلوية اليمنى، واختر New repository.

اسم المستودع (Repository Name): اختر أي اسم (مثلاً: education-platform أو my-learning-site).

الوصف: أضف وصفًا لمشروعك.

النوع (Visibility): تأكد من اختيار Public (عام) لكي تتمكن من استضافته مجانًا.

اضغط على Create repository.

الخطوة 2: رفع ملفات المشروع كاملة
يجب عليك رفع كل المجلدات والملفات التي قمنا بإنشائها (بما فيها الفيديوهات والصور). لديك خياران للرفع:

الخيار 1: الرفع اليدوي (الأسهل للمبتدئين)
داخل المستودع الذي أنشأته، اضغط على زر Add file ثم Upload files.

قم بسحب وإسقاط كل محتويات مجلدك الرئيسي project_folder بالكامل (يشمل ملفات HTML ومجلدات css/, js/, course_thumbnails/) إلى هذه الصفحة.

تأكد من وجود ملف index.html في المسار الرئيسي للمستودع.

في الأسفل، اكتب رسالة التزام (Commit message) مثل: Initial commit: Upload all site files.

اضغط على Commit changes.

الخيار 2: استخدام Git Bash (الطريقة الاحترافية)
إذا كنت تستخدم برنامج Git على جهازك (مستحسن):

افتح Terminal أو Git Bash داخل مجلد project_folder.

نفذ الأوامر التالية بالترتيب (استبدل الرابط برابط مستودعك):

Bash

git init
git add .
git commit -m "Initial commit for hosting on GitHub Pages"
git branch -M main
git remote add origin [ضع رابط مستودعك هنا، مثل: https://github.com/YourUsername/RepoName.git]
git push -u origin main
الخطوة 3: تفعيل GitHub Pages
هذه هي الخطوة التي تحوّل ملفاتك إلى موقع ويب فعلي:

في صفحة المستودع على GitHub، اذهب إلى علامة التبويب Settings (الإعدادات).

في القائمة الجانبية اليسرى، اضغط على Pages (صفحات).

في قسم Build and deployment (البناء والنشر):

تحت Source (المصدر)، تأكد من اختيار Deploy from a branch.

تحت Branch (الفرع):

اختر الفرع الرئيسي لملفاتك، وهو عادةً main أو master.

تأكد من ترك المجلد (Folder) كـ / (root)، لأن ملف index.html موجود في الجذر.

اضغط على زر Save.

الخطوة 4: الحصول على رابط الموقع
بعد الضغط على Save، سيستغرق GitHub بضع دقائق (عادةً أقل من دقيقة) لإنشاء ونشر الموقع.

بعد اكتمال عملية النشر، عد إلى صفحة Settings ثم Pages.

سيظهر لك الآن رسالة خضراء تقول: Your site is live at [الرابط الخاص بك].

شكل رابط موقعك سيكون هكذا:

https://[اسم_مستخدمك].github.io/[اسم_المستودع]/

