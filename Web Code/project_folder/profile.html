<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايلي - أكاديمية النجاح</title>
    <link rel="stylesheet" href="css/colors.css"> 
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="profile-page">

    <header class="navbar">
        <div class="logo">
            <img src="js/images/logo.png" alt="شعار الأكاديمية" style="height: 40px; margin-top: -5px;">
        </div>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="courses.html">الكورسات</a>
            <a href="profile.html" class="btn btn-primary">بروفايلي</a>
            <a href="#" onclick="logout()" class="btn btn-secondary">تسجيل الخروج</a>
        </nav>
    </header>

    <section class="profile">
        <div class="container">
            <div class="profile-container">
                <div class="profile-header">
                    <h2>ملفي الشخصي</h2>
                    <div class="profile-image-box">
                        <img id="profile-img" src="js/images/default-profile.png" alt="صورة البروفايل">
                        <label for="profile-image-upload" class="profile-image-upload-btn">
                            تغيير الصورة
                        </label>
                        <input type="file" id="profile-image-upload" accept="image/*" style="display: none;">
                    </div>
                    <h3 id="profile-name">اسم المستخدم</h3>
                </div>

                <div class="profile-details">
                    <h3>معلومات الحساب</h3>
                    <p>البريد الإلكتروني: <span id="profile-email">email@example.com</span></p>
                </div>
                
                <div class="enrolled-courses">
                    <h3>كورساتي المجانية</h3>
                    <ul id="enrolled-courses-list" style="list-style: none;">
                        </ul>
                </div>
                
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 أكاديمية النجاح. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        checkAuthenticationAndRedirect(true);
    </script>
</body>
</html>
