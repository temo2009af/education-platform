<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أكاديمية النجاح</title>
    <link rel="stylesheet" href="css/colors.css"> 
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="js/images/logo.png" alt="شعار الأكاديمية" style="height: 40px; margin-top: -5px;">
        </div>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="courses.html">الكورسات</a>
            <a href="profile.html">بروفايلي</a>
            <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
            <a href="signup.html" class="btn btn-secondary">إنشاء حساب</a>
        </nav>
    </header>

    <section class="auth">
        <div class="auth-container">
            <h2>تسجيل الدخول</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">دخول</button>
            </form>
            <p class="switch-auth-link">
                لا تمتلك حساباً؟ <a href="signup.html">قم بإنشاء حساب جديد</a>
            </p>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 أكاديمية النجاح. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        checkAuthenticationAndRedirect(false);
    </script>
</body>
</html>
